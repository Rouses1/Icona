name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-levels: '33'
          ndk-version: '25.1.8937393'

      - name: Create keystore directory
        run: mkdir -p keystore

      - name: Create or restore keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/oxide.keystore
          else
            echo "⚠️ WARNING: No keystore found in secrets. Using debug signing only."
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x ./app/gradlew 2>/dev/null || chmod +x ./gradlew 2>/dev/null || echo "gradlew not found, will use gradle from PATH"

      - name: Build APK (Release)
        if: github.event_name == 'push' && secrets.KEYSTORE_BASE64 != ''
        run: |
          cd OxideCheat
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4096m -XX:+UseG1GC

      - name: Build APK (Debug)
        if: github.event_name != 'push' || secrets.KEYSTORE_BASE64 == ''
        run: |
          cd OxideCheat
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4096m -XX:+UseG1GC

      - name: Upload Release APK
        if: github.event_name == 'push' && secrets.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: OxideCheat/app/build/outputs/apk/release/

      - name: Upload Debug APK
        if: github.event_name != 'push' || secrets.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: OxideCheat/app/build/outputs/apk/debug/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') && secrets.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v1
        with:
          files: OxideCheat/app/build/outputs/apk/release/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "OxideCheat/app/build/outputs/apk" ]; then
            echo "✅ APK builds found:" >> $GITHUB_STEP_SUMMARY
            find OxideCheat/app/build/outputs/apk -name "*.apk" -exec echo "  - {}" \; >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK builds found" >> $GITHUB_STEP_SUMMARY
          fi
