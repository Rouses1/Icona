name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip and find project dir
        id: proj
        run: |
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            echo "Unzipping $z"
            unzip -q -o "$z" -d "_unzipped"
          done
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle not found. Repo contents:"
            find . -maxdepth 3 -not -path "./.git/*"
            exit 1
          fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Project dir: $d"

      - name: Fix repository mode conflict
        run: |
          SETTINGS="${{ steps.proj.outputs.dir }}/settings.gradle"
          sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/g' "$SETTINGS"
          echo "--- settings.gradle after fix ---"
          cat "$SETTINGS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install CMake and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" "build-tools;33.0.2" \
            "cmake;3.18.1" "ndk;25.2.9519653"

      - name: Set up Gradle 8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1'

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/**/*.apk
