name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-levels: '33'
          ndk-version: '25.1.8937393'

      - name: Create keystore directory
        run: mkdir -p keystore

      - name: Create or restore keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/oxide.keystore
          else
            echo "⚠️ WARNING: Using debug signing"
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x ./app/gradlew 2>/dev/null || chmod +x ./gradlew 2>/dev/null || echo "gradlew found"

      - name: Build APK (Release)
        if: github.event_name == 'push' && secrets.KEYSTORE_BASE64 != null
        run: |
          cd OxideCheat
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4096m -XX:+UseG1GC

      - name: Build APK (Debug)
        if: github.event_name != 'push' || secrets.KEYSTORE_BASE64 == null
        run: |
          cd OxideCheat
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4096m -XX:+UseG1GC

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: apk
          path: OxideCheat/app/build/outputs/apk/**/
